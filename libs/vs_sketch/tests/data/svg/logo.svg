<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- A fixture in the shape Inkscape writes: a document in mm, a layer group
     with a transform, editor metadata, styles, and one path holding an outer
     outline of smooth curves and a slot hole; a circle is the second hole. -->
<svg
   width="80mm"
   height="60mm"
   viewBox="0 0 80 60"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" inkscape:document-units="mm" />
  <defs id="defs1">
    <linearGradient id="grad"><stop offset="0" style="stop-color:#000000" /></linearGradient>
  </defs>
  <g inkscape:label="Layer 1" inkscape:groupmode="layer" id="layer1" transform="translate(-5,2)">
    <path
       style="fill:url(#grad);stroke:#000000;stroke-width:0.264583"
       d="m 15,28 c 0,-20 60,-20 60,0 c 0,20 -60,20 -60,0 z
          M 50,25 h 10 a 3,3 0 0 1 0,6 h -10 a 3,3 0 0 1 0,-6 z"
       id="path1" />
    <circle style="fill:none;stroke:#000000" id="hole" cx="30" cy="28" r="5" />
    <text x="20" y="5" id="text1"><tspan>logo</tspan></text>
  </g>
</svg>
