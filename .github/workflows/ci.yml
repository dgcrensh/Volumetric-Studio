name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    permissions:
      # contents: write lets linux-gcc-release publish the vcpkg cache as
      # release assets (see the last step).
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-msvc-release
          - os: ubuntu-24.04
            preset: linux-gcc-release
          - os: ubuntu-24.04
            preset: linux-clang-debug
    env:
      # vcpkg's binary cache, kept between runs by actions/cache below.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config zip unzip curl tar
          # Open CASCADE (vs_kernel) builds its visualisation toolkits against
          # the system's OpenGL and X11 headers.
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # The top-level CMakeLists.txt selects the vcpkg manifest features, so
      # it is part of the key. The cache is saved even when tests fail, so a
      # long dependency build (OCCT) is never paid twice.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'CMakeLists.txt') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Preset ${{ matrix.preset }}

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh ${{ matrix.preset }}

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # actions/cache is readable only from inside Actions. Publish the Linux
      # cache as assets of the "vcpkg-cache-x64-linux" prerelease too, so cloud
      # dev sessions can fetch it with scripts/vcpkg-cache.sh fetch. Only from
      # main and manual runs, never from pull requests.
      - name: Publish vcpkg binary cache for machines outside Actions
        if: >-
          always() && matrix.preset == 'linux-gcc-release' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/vcpkg-cache.sh publish "$VCPKG_DEFAULT_BINARY_CACHE"
          "build/${{ matrix.preset }}/vcpkg_installed"
