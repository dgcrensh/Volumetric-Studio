name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Runs on main are never
# cancelled: a merge mid-build would otherwise throw away an hour of Open
# CASCADE build, and the vcpkg cache would never get it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    # Read-only: publishing the vcpkg cache is the publish-cache job's.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: windows-msvc-release
            family: windows
          - os: ubuntu-24.04
            preset: linux-gcc-release
            family: linux
          - os: ubuntu-24.04
            preset: linux-clang-debug
            family: linux
          # AddressSanitizer and UndefinedBehaviorSanitizer over every suite
          # (plan H1). vcpkg's dependencies aren't instrumented; they are the
          # same binaries as the other Linux jobs'.
          - os: ubuntu-24.04
            preset: linux-clang-asan
            family: linux
    env:
      # vcpkg's binary cache, kept between runs by actions/cache below.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config zip unzip curl tar
          # Clang's sanitizer runtimes, for linux-clang-asan.
          sudo apt-get install -y libclang-rt-dev
          # Open CASCADE (vs_kernel) builds its visualisation toolkits against
          # the system's OpenGL and X11 headers.
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev

      - name: Create vcpkg binary cache directory
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # vcpkg's files cache is content-addressed: each archive is named by its
      # package ABI hash, so the list of names says exactly what the cache
      # holds. The key is that list's hash (computed after the build, below).
      # Restore never matches exactly: it takes the newest entry for this
      # preset (this branch first, then main), and the save step stores a new
      # entry whenever the build added an archive. A fixed key would hit the
      # first entry ever saved forever and never save the packages built
      # after it, which is how Open CASCADE got rebuilt on every run.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-restore
          # This preset's newest entry, else any of the same OS: every Linux
          # preset uses the same x64-linux binaries (vcpkg builds them with
          # the system compiler whatever the preset's), so a new preset
          # doesn't build Open CASCADE again.
          restore-keys: |
            vcpkg-${{ matrix.preset }}-
            vcpkg-${{ matrix.family }}-

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Preset ${{ matrix.preset }}

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh ${{ matrix.preset }}

      # Procedural and evaluation results must not depend on the thread
      # count (plan H3): their suites again with every default-sized pool
      # at 1, 4 and 16 threads (eval::default_thread_count()).
      - name: vs_proc and vs_eval on 1, 4 and 16 threads
        if: matrix.preset == 'linux-gcc-release'
        run: |
          for threads in 1 4 16; do
            echo "::group::VS_THREADS=$threads"
            VS_THREADS=$threads ctest --preset ${{ matrix.preset }} -L 'vs_proc|vs_eval' --output-on-failure -j 2
            echo "::endgroup::"
          done

      # Saved even when the build or tests fail, so a long dependency build
      # (OCCT) is never paid twice. Never from a cancelled run, though: a
      # newer push cancels a pull request's run mid-build, and saving then
      # would store a half-built cache under a new key.
      - name: Hash vcpkg binary cache contents
        id: vcpkg-cache-key
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cd "$VCPKG_DEFAULT_BINARY_CACHE"
          count="$(find . -name '*.zip' | wc -l)"
          contents="$(find . -name '*.zip' | sort | sha256sum | cut -c1-40)"
          echo "$count archive(s), contents $contents"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "key=vcpkg-${{ matrix.preset }}-$contents" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg binary cache
        if: >-
          !cancelled() && steps.vcpkg-cache-key.outputs.count != '0' &&
          steps.vcpkg-cache-key.outputs.key != steps.vcpkg-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache-key.outputs.key }}

      # The publish-cache job needs to know which archives this build used:
      # each installed port's vcpkg_abi_info.txt (a few KB in all), kept in
      # vcpkg_installed's layout.
      - name: Pack the installed ports' ABI files for publish-cache
        id: abi
        if: >-
          !cancelled() && matrix.preset == 'linux-gcc-release' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cd "build/${{ matrix.preset }}/vcpkg_installed"
          find . -path './*/share/*/vcpkg_abi_info.txt' -print0 |
            tar -cf "$GITHUB_WORKSPACE/vcpkg-abi.tar" --null -T -

      - name: Keep them for publish-cache
        if: ${{ !cancelled() && steps.abi.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-abi
          path: vcpkg-abi.tar
          retention-days: 1

  # actions/cache is readable only from inside Actions. Publish the Linux
  # cache as assets of the "vcpkg-cache-x64-linux" prerelease too, so cloud
  # dev sessions can fetch it with scripts/vcpkg-cache.sh fetch. Only from
  # main and manual runs, never from pull requests, and in a job of its own
  # so that only this job can write to the repository.
  publish-cache:
    name: publish vcpkg cache
    needs: build
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - name: Download the installed ports' ABI files
        id: abi
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vcpkg-abi

      # The newest entry linux-gcc-release saved: the one its build just
      # stored, or the one it restored when it added nothing.
      - name: Restore linux-gcc-release's vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-linux-gcc-release-restore
          restore-keys: vcpkg-linux-gcc-release-

      - name: Publish vcpkg binary cache for machines outside Actions
        if: steps.vcpkg-cache.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without the ABI files, publish takes every archive in the cache.
          installed=()
          if [[ -f vcpkg-abi.tar ]]; then
            mkdir -p vcpkg-abi && tar -xf vcpkg-abi.tar -C vcpkg-abi
            installed=(vcpkg-abi)
          fi
          ./scripts/vcpkg-cache.sh publish "$VCPKG_DEFAULT_BINARY_CACHE" "${installed[@]}"
